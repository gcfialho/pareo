<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1200px;height:630px;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px}
.brand{display:flex;align-items:center;gap:20px;font-size:40px;font-weight:700;letter-spacing:-.02em}
h1{font-size:76px;line-height:1.05;font-weight:800;letter-spacing:-.035em;max-width:1040px;text-wrap:balance}
.clt{color:#7aa2ff}.pj{color:#4fd69a}
p{font-size:30px;color:#cbd5e1;margin-top:20px;font-weight:500}
.bars{display:flex;gap:28px;align-items:flex-end}
.bar{width:330px}.lbl{display:flex;justify-content:space-between;font-size:24px;color:#cbd5e1;margin-bottom:10px;font-weight:600}
.track{height:22px;border-radius:8px;background:#1e293b;display:flex;overflow:hidden;gap:3px}
.foot{display:flex;justify-content:space-between;align-items:flex-end}
.url{font-size:24px;color:#94a3b8;font-weight:500}
</style></head><body>
<div class="brand"><svg width="64" height="64" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#1e293b"/><rect x="7" y="7.5" width="18" height="2" rx="1" fill="#fff"/><rect x="8.5" y="12" width="6" height="12.5" rx="2" fill="#3b6fe0"/><rect x="17.5" y="12" width="6" height="12.5" rx="2" fill="#16a067"/></svg>Páreo</div>
<div><h1><span class="clt">CLT</span> × <span class="pj">PJ</span> na ponta do lápis</h1>
<p>Quanto o CLT vale de verdade e quanto faturar como PJ para ser páreo.</p></div>
<div class="foot">
 <div class="bars">
  <div class="bar"><div class="lbl"><span>CLT</span><span>fica com você</span></div><div class="track"><div style="width:77%;background:#3b6fe0"></div><div style="width:23%;background:#fda4af"></div></div></div>
  <div class="bar"><div class="lbl"><span>PJ</span><span>fica com você</span></div><div class="track"><div style="width:77%;background:#16a067"></div><div style="width:8%;background:#fda4af"></div></div></div>
 </div>
 <div class="url">gcfialho.github.io/pareo</div>
</div></body></html>
